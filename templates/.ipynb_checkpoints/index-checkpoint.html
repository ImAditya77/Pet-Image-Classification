<!DOCTYPE html>
<html>
<head>
    <title>Pet Image Classifier</title>

    <style>

        body{
            font-family:Arial;
            background:#f5f5f5;
            text-align:center;
            margin-top:60px;
        }

        .box{
            width:420px;
            margin:auto;
            background:white;
            padding:25px;
            border-radius:15px;
            box-shadow:0px 0px 15px rgba(0,0,0,.2);
        }

        h1{
            color:#333;
        }

        button{
            padding:12px 25px;
            background:#4CAF50;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:18px;
        }

    </style>

</head>

<body>

<div class="box">

<h1>🐶🐱 Pet Image Classification</h1>

<form action="/predict" method="POST" enctype="multipart/form-data">

<input type="file" name="image" required>

<br><br>

<button type="submit">

Predict

</button>

</form>

{% if prediction %}

<h2>{{prediction}}</h2>

{% endif %}

</div>

</body>
</html>
